<style>
/* Layout: a deep-blue title band above one centred reading column; one screen at a time (start, question, result). */
:root {
  --navy: #0B2A5B;
  --on-navy: #FFFFFF;
  --bg: #F2F5FA;
  --surface: #FFFFFF;
  --ink: #0E1A33;
  --muted: #55627C;
  --line: #CCD6E6;
  --head: #0B2A5B;
  --accent: #0B2A5B;
  --accent-hover: #123B7C;
  --on-accent: #FFFFFF;
  --pick: #E5ECF8;
  --ok-text: #16703E;
  --ok-solid: #16703E;
  --ok-bg: #E0F3E7;
  --bad-text: #B3261E;
  --bad-solid: #B3261E;
  --bad-bg: #FBE5E3;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --fs: 27px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1224;
    --surface: #12203F;
    --ink: #E8EDF7;
    --muted: #A5B2CB;
    --line: #2B3C62;
    --head: #A9C1F3;
    --accent: #3866C4;
    --accent-hover: #4A78D6;
    --pick: #1B2D55;
    --ok-text: #72D69D;
    --ok-solid: #2A9A60;
    --ok-bg: #12392A;
    --bad-text: #FF9D95;
    --bad-solid: #D4463D;
    --bad-bg: #4A1E1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1224;
  --surface: #12203F;
  --ink: #E8EDF7;
  --muted: #A5B2CB;
  --line: #2B3C62;
  --head: #A9C1F3;
  --accent: #3866C4;
  --accent-hover: #4A78D6;
  --pick: #1B2D55;
  --ok-text: #72D69D;
  --ok-solid: #2A9A60;
  --ok-bg: #12392A;
  --bad-text: #FF9D95;
  --bad-solid: #D4463D;
  --bad-bg: #4A1E1B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.5;
}
.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band { background: var(--navy); color: var(--on-navy); padding-block: 28px; }
.band h1 {
  margin: 0;
  font-size: 1.3em;
  font-weight: 700;
  line-height: 1.25;
  text-wrap: balance;
}
main.wrap { padding-block: 48px 72px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 40px;
}
.card h2 { margin: 0 0 16px; font-size: 1.15em; font-weight: 700; color: var(--head); text-wrap: balance; }
.lead { margin: 0 0 32px; color: var(--muted); }

label.field { display: block; margin-bottom: 10px; font-weight: 600; }
input[type="text"] {
  display: block;
  width: 100%;
  margin-bottom: 28px;
  padding: 14px 18px;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 6px;
}
input[type="text"]::placeholder { color: var(--muted); opacity: .8; }
input[type="text"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }

.btn {
  font: inherit;
  font-weight: 600;
  padding: 14px 34px;
  color: var(--on-accent);
  background: var(--accent);
  border: 2px solid var(--accent);
  border-radius: 6px;
  cursor: pointer;
  transition: background-color .15s;
}
.btn:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn:focus-visible { outline: 3px solid var(--head); outline-offset: 3px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* Question screen */
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 24px; margin-bottom: 12px; }
.counter { font-weight: 700; color: var(--head); font-variant-numeric: tabular-nums; }
.who { font-size: .7em; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 32px; }
.bar > span { display: block; height: 100%; width: 0; background: var(--head); transition: width .25s; }
.question { margin: 0 0 28px; font-size: 1em; font-weight: 600; line-height: 1.45; }

.options { display: grid; gap: 14px; }
.opt {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  width: 100%;
  min-width: 0;
  padding: 16px 22px;
  font: inherit;
  text-align: left;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
.opt:hover:not(:disabled) { border-color: var(--head); background: var(--pick); }
.opt:focus-visible { outline: 3px solid var(--head); outline-offset: 2px; }
.opt:disabled { cursor: default; opacity: 1; color: var(--ink); }
.letter {
  flex: none;
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  font-weight: 700;
  color: var(--head);
  background: var(--pick);
  border-radius: 4px;
}
.txt { min-width: 0; padding-top: 6px; overflow-wrap: anywhere; }
.tag { display: block; margin-top: 4px; font-size: .62em; font-weight: 600; letter-spacing: .02em; }
.opt.is-correct { border-color: var(--ok-solid); background: var(--ok-bg); }
.opt.is-correct .letter { background: var(--ok-solid); color: #fff; }
.opt.is-correct .tag { color: var(--ok-text); }
.opt.is-wrong { border-color: var(--bad-solid); background: var(--bad-bg); }
.opt.is-wrong .letter { background: var(--bad-solid); color: #fff; }
.opt.is-wrong .tag { color: var(--bad-text); }

.feedback { margin-top: 28px; padding: 20px 24px; border: 2px solid var(--line); border-radius: 6px; }
.feedback.ok { background: var(--ok-bg); border-color: var(--ok-solid); }
.feedback.no { background: var(--bad-bg); border-color: var(--bad-solid); }
.feedback .verdict { margin: 0; font-weight: 700; }
.feedback.ok .verdict { color: var(--ok-text); }
.feedback.no .verdict { color: var(--bad-text); }
.feedback .why { margin: 10px 0 0; }
.actions { display: flex; justify-content: flex-end; margin-top: 28px; }

/* Result screen */
.who-label { margin: 0; font-size: .7em; color: var(--muted); }
.who-name { margin: 0 0 28px; font-weight: 700; overflow-wrap: anywhere; }
.score { margin: 0 0 14px; font-size: 1.4em; font-weight: 700; color: var(--head); font-variant-numeric: tabular-nums; }
.result-bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin-bottom: 36px; }
.result-bar > span { display: block; height: 100%; background: var(--head); }

@media (max-width: 640px) {
  .card { padding: 22px; }
  main.wrap { padding-block: 28px 48px; }
  .opt { padding: 14px 16px; gap: 14px; }
  .letter { width: 42px; height: 42px; }
  .actions .btn, #start-form .btn, #restart { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<header class="band">
  <div class="wrap">
    <h1>Tổng quan Writing task 1</h1>
  </div>
</header>

<main class="wrap">
  <!-- Start screen -->
  <section class="card" id="screen-start" aria-labelledby="start-title">
    <h2 id="start-title">Bắt đầu làm bài</h2>
    <p class="lead">Bài kiểm tra gồm 20 câu trắc nghiệm về IELTS Academic Writing Task 1. Thứ tự câu hỏi được sắp xếp ngẫu nhiên mỗi lần làm bài.</p>
    <form id="start-form" novalidate>
      <label class="field" for="student-name">Họ và tên</label>
      <input type="text" id="student-name" name="student-name" placeholder="Nhập họ và tên của bạn" autocomplete="name" maxlength="80">
      <button type="submit" class="btn" id="start-btn" disabled>Bắt đầu</button>
    </form>
  </section>

  <!-- Question screen -->
  <section class="card" id="screen-quiz" aria-live="off" hidden>
    <div class="meta">
      <span class="counter" id="counter"></span>
      <span class="who" id="who"></span>
    </div>
    <div class="bar" aria-hidden="true"><span id="bar-fill"></span></div>
    <h2 class="question" id="question"></h2>
    <div class="options" id="options" role="group" aria-labelledby="question"></div>
    <div class="feedback" id="feedback" role="status" hidden></div>
    <div class="actions">
      <button type="button" class="btn" id="next-btn" hidden>Câu tiếp theo</button>
    </div>
  </section>

  <!-- Result screen -->
  <section class="card" id="screen-result" aria-labelledby="result-title" hidden>
    <h2 id="result-title">Kết quả bài làm</h2>
    <p class="who-label">Học sinh</p>
    <p class="who-name" id="result-name"></p>
    <p class="score" id="result-score"></p>
    <div class="result-bar" aria-hidden="true"><span id="result-fill"></span></div>
    <button type="button" class="btn" id="restart">Làm lại</button>
  </section>
</main>

<script id="quiz-data">
// Each item: q = question, options = answers in A–D order, correct = index of the right option, explanation = shown after a wrong answer.

<script>
(function () {
  var LETTERS = ["A", "B", "C", "D"];
  var $ = function (id) { return document.getElementById(id); };

  var screens = { start: $("screen-start"), quiz: $("screen-quiz"), result: $("screen-result") };
  var nameInput = $("student-name");
  var startBtn = $("start-btn");
  var nextBtn = $("next-btn");
  var feedback = $("feedback");
  var optionsBox = $("options");

  var order = [];       // shuffled indices into QUESTIONS
  var pos = 0;          // position in the shuffled order
  var score = 0;
  var answered = false;
  var studentName = "";

  // Fisher–Yates shuffle (returns a new array)
  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function newRound() {
    order = shuffle(QUESTIONS.map(function (_, i) { return i; }));
    pos = 0;
    score = 0;
    answered = false;
  }

  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].hidden = (k !== name); });
    window.scrollTo(0, 0);
  }

  function syncStartButton() {
    startBtn.disabled = nameInput.value.trim().length === 0;
  }

  function setBar(done) {
    $("bar-fill").style.width = (done / QUESTIONS.length * 100) + "%";
  }

  function renderQuestion() {
    var item = QUESTIONS[order[pos]];
    answered = false;

    $("counter").textContent = "Câu " + (pos + 1) + " / " + QUESTIONS.length;
    $("who").textContent = studentName;
    $("question").textContent = item.q;
    setBar(pos);

    optionsBox.textContent = "";
    item.options.forEach(function (text, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt";
      btn.dataset.index = String(i);

      var letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = LETTERS[i];

      var txt = document.createElement("span");
      txt.className = "txt";
      txt.appendChild(document.createTextNode(text));

      btn.appendChild(letter);
      btn.appendChild(txt);
      btn.addEventListener("click", function () { choose(i); });
      optionsBox.appendChild(btn);
    });

    feedback.hidden = true;
    feedback.textContent = "";
    feedback.className = "feedback";
    nextBtn.hidden = true;
    nextBtn.textContent = (pos === QUESTIONS.length - 1) ? "Xem kết quả" : "Câu tiếp theo";
  }

  function addTag(btn, label) {
    var tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = label;
    btn.querySelector(".txt").appendChild(tag);
  }

  function choose(i) {
    if (answered) return;
    answered = true;

    var item = QUESTIONS[order[pos]];
    var buttons = optionsBox.querySelectorAll(".opt");
    var isRight = (i === item.correct);

    buttons.forEach(function (b) { b.disabled = true; });
    setBar(pos + 1);

    var verdict = document.createElement("p");
    verdict.className = "verdict";

    if (isRight) {
      score++;
      buttons[i].classList.add("is-correct");
      addTag(buttons[i], "Đáp án đúng");
      feedback.className = "feedback ok";
      verdict.textContent = "Chính xác! Chúc mừng bạn!";
      feedback.appendChild(verdict);
    } else {
      buttons[i].classList.add("is-wrong");
      addTag(buttons[i], "Bạn đã chọn");
      buttons[item.correct].classList.add("is-correct");
      addTag(buttons[item.correct], "Đáp án đúng");
      feedback.className = "feedback no";
      verdict.textContent = "Chưa đúng. Đáp án đúng là " + LETTERS[item.correct] + ".";
      var why = document.createElement("p");
      why.className = "why";
      why.textContent = item.explanation;
      feedback.appendChild(verdict);
      feedback.appendChild(why);
    }

    feedback.hidden = false;
    nextBtn.hidden = false;
    nextBtn.focus();
  }

  function showResult() {
    $("result-name").textContent = studentName;
    $("result-score").textContent = "Số câu đúng: " + score + " / " + QUESTIONS.length;
    $("result-fill").style.width = (score / QUESTIONS.length * 100) + "%";
    show("result");
  }

  $("start-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var value = nameInput.value.trim();
    if (!value) return;
    studentName = value;
    renderQuestion();
    show("quiz");
  });

  nameInput.addEventListener("input", syncStartButton);

  nextBtn.addEventListener("click", function () {
    pos++;
    if (pos >= QUESTIONS.length) {
      showResult();
    } else {
      renderQuestion();
      window.scrollTo(0, 0);
    }
  });

  $("restart").addEventListener("click", function () {
    newRound();
    syncStartButton();
    show("start");
    nameInput.focus();
  });

  newRound();
  syncStartButton();
})();
</script>
